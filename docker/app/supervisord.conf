; All-in-one process supervisor for the `all` entrypoint role.
;
; The `all` role has already migrated, bootstrapped, cached config and
; rendered the nginx config before starting supervisord, so php-fpm and nginx
; are launched directly here (not via the `serve` role, which would repeat
; those boot steps). The worker and scheduler run through the entrypoint's own
; roles so their commands live in one place.
;
; Logs from every process go to the container's stdout/stderr, so
; `docker logs` (and the Unraid log view) shows the whole stack in one stream.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=app-entrypoint worker
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=app-entrypoint scheduler
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
