name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, gd, intl, zip, bcmath
          coverage: none

      - name: Dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Tests
        working-directory: backend
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # Generates .nuxt/ including the config from @nuxt/eslint that the lint
      # needs. The postinstall prepare is skipped by --ignore-scripts, so it is
      # run explicitly here.
      - name: Prepare Nuxt
        working-directory: frontend
        run: npx nuxt prepare

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Types
        working-directory: frontend
        run: npx nuxt typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Build images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Checks that both Dockerfiles build — without publishing them.
      - name: App image
        run: docker build -f docker/app/Dockerfile -t nextsearch/app:ci .

      - name: Web image
        run: docker build -f docker/web/Dockerfile -t nextsearch/web:ci .
