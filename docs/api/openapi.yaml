openapi: 3.1.0

info:
  title: NextSearch API
  version: "1.0"
  description: |
    Search and tagging over HTTP, authenticated with a personal API key, and
    an admin section for keeping accounts and folders in step with another
    system.

    A key carries no permissions of its own: a request does exactly what its
    owner can do in the interface — the same folder grants, the same tags.
    Create one under User settings › API keys; the plain text is shown once.

    Prose, examples and the parts this file cannot express:
    https://github.com/McGo/NextSearch/blob/main/docs/api.md
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://search.example.org/api/v1
    description: Replace the host with your own installation.

security:
  - bearerAuth: []

tags:
  - name: Account
  - name: Documents
  - name: Tags
  - name: Admin
    description: |
      Accounts, folders, shares and re-indexing. Needs a key that was made with
      the admin flag, by someone who is still an administrator.

paths:
  /me:
    get:
      tags: [Account]
      summary: The account this key belongs to
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /documents:
    get:
      tags: [Documents]
      summary: Search
      description: |
        Full-text search across the folders granted to the key's owner. Without
        `q` it lists everything the caller may see.
      operationId: searchDocuments
      parameters:
        - name: q
          in: query
          description: The query.
          schema: { type: string, maxLength: 500 }
        - name: filters
          in: query
          description: |
            JSON object of `facet => [values]`. Facet names are the ones the
            response returns: `tags`, `my_tags`, `instance_name`,
            `folder_label`, `path_segments`, `extension`, `year`,
            `size_bucket`, `ocr_used`. Tag facets take tag uuids.
          example: '{"extension":["pdf"],"year":["2019"]}'
          schema: { type: string, maxLength: 4000 }
        - name: sort
          in: query
          schema:
            type: string
            default: relevance
            enum: [relevance, newest, oldest, largest, name]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /documents/{document}:
    parameters:
      - $ref: "#/components/parameters/DocumentUuid"
    get:
      tags: [Documents]
      summary: One document with its metadata and tags
      operationId: showDocument
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: "#/components/schemas/DocumentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/{document}/tags:
    parameters:
      - $ref: "#/components/parameters/DocumentUuid"
    get:
      tags: [Tags]
      summary: The tags on a document
      description: Global assignments plus the caller's own. Nobody else's.
      operationId: listDocumentTags
      responses:
        "200":
          $ref: "#/components/responses/DocumentTags"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Tags]
      summary: Add tags
      description: What is already on the document stays. This is not a replacement.
      operationId: addDocumentTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagKeyList"
      responses:
        "200":
          $ref: "#/components/responses/DocumentTags"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      tags: [Tags]
      summary: Replace the set of tags
      description: |
        Only tags the caller could assign anyway are affected — someone else's
        personal assignment and a tag reserved for administrators stay put.
      operationId: replaceDocumentTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagKeyList"
      responses:
        "200":
          $ref: "#/components/responses/DocumentTags"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /documents/{document}/tags/{tag}:
    parameters:
      - $ref: "#/components/parameters/DocumentUuid"
      - name: tag
        in: path
        required: true
        description: Slug or uuid of the tag.
        schema: { type: string }
    delete:
      tags: [Tags]
      summary: Take one tag off a document
      operationId: removeDocumentTag
      responses:
        "200":
          $ref: "#/components/responses/DocumentTags"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/tags:
    post:
      tags: [Tags]
      summary: Tag many documents in one call
      description: |
        Documents the caller has no access to are skipped rather than refused —
        a wide selection should not fail over one folder that was never granted.
      operationId: bulkTagDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
                add:
                  type: array
                  maxItems: 50
                  description: Slugs or uuids.
                  items: { type: string }
                remove:
                  type: array
                  maxItems: 50
                  items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                    description: Documents actually touched.
                  skipped:
                    type: array
                    description: Uuids the caller has no access to.
                    items: { type: string, format: uuid }
                  unknown:
                    type: array
                    description: Uuids that match no document.
                    items: { type: string, format: uuid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tags:
    get:
      tags: [Tags]
      summary: The vocabulary
      description: The instance tags plus the caller's own private ones.
      operationId: listTags
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tags]
      summary: Create a tag
      description: |
        Without `owner` the result is a private tag: personal in scope, never
        automatic, visible to nobody else. `owner: instance` adds to the
        installation's vocabulary and needs an administrator.
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TagWritable"
                - type: object
                  required: [name]
                  properties:
                    owner:
                      type: string
                      default: me
                      enum: [me, instance]
                    scope:
                      type: string
                      default: global
                      description: Instance tags only. Fixed once created.
                      enum: [global, personal]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only administrators maintain the instance vocabulary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /tags/{tag}:
    parameters:
      - name: tag
        in: path
        required: true
        description: The tag's uuid.
        schema: { type: string, format: uuid }
    patch:
      tags: [Tags]
      summary: Change a tag
      description: |
        Slug and scope are not changeable. A system tag additionally refuses
        `assign_policy` and `auto_rule` — its identity comes with the
        installation.
      operationId: updateTag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagWritable" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [Tags]
      summary: Delete a tag
      description: Takes its assignments with it. System tags are refused.
      operationId: deleteTag
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The tag comes with the installation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/instances:
    get:
      tags: [Admin]
      summary: List the Nextcloud instances
      description: Read only. Credentials never leave the server.
      operationId: adminListInstances
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items: { $ref: "#/components/schemas/Instance" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"

  /admin/folders:
    get:
      tags: [Admin]
      summary: List the watched folders
      operationId: adminListFolders
      parameters:
        - name: instance
          in: query
          description: Only the folders of this instance (uuid).
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items: { $ref: "#/components/schemas/Folder" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
    post:
      tags: [Admin]
      summary: Watch a folder
      description: |
        The path is checked against Nextcloud before the folder is created. A
        path that is already watched on the instance answers `409` and carries
        the existing folder, so a caller can treat the call as idempotent.
      operationId: adminCreateFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instance, label, remote_path]
              properties:
                instance: { type: string, format: uuid }
                label: { type: string, maxLength: 190 }
                remote_path:
                  type: string
                  maxLength: 1000
                  description: Relative to the WebDAV root of the instance's account.
                interval_minutes: { type: integer, minimum: 1, maximum: 10080 }
                exclude_patterns:
                  type: array
                  items: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  folder: { $ref: "#/components/schemas/Folder" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
        "409":
          description: Already watched. The body carries the existing folder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  folder: { $ref: "#/components/schemas/Folder" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /admin/folders/{folder}/reindex:
    parameters:
      - name: folder
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Crawl a folder now
      description: |
        Without `path` the whole folder is crawled. With `path` only that
        directory, relative to the folder; a path to a file crawls the
        directory it sits in. If a run is already going, a `path` is added to
        it and the response names that run.
      operationId: adminReindexFolder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, maxLength: 1000, example: "2026/rentenbescheid.pdf" }
                full:
                  type: boolean
                  description: Re-extract files even if they have not changed.
      responses:
        "200":
          description: Started, or added to the running run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    type: object
                    properties:
                      uuid: { type: string, format: uuid }
                      state: { type: string, enum: [running, completed] }
                      path: { type: [string, "null"] }
                  message: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /admin/users:
    get:
      tags: [Admin]
      summary: List accounts
      operationId: adminListUsers
      parameters:
        - name: email
          in: query
          description: Only the account with this address, compared case-insensitively.
          schema: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/ManagedUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
    post:
      tags: [Admin]
      summary: Create an account
      description: |
        Without `password` the account gets an invitation link instead, which
        comes back in this response and nowhere else. NextSearch sends no mail;
        pass the link on yourself.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 190 }
                email: { type: string, format: email, maxLength: 190 }
                password: { type: string, minLength: 12 }
                role: { type: string, enum: [admin, user], default: user }
                folders:
                  type: array
                  description: Folder uuids to share right away.
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/ManagedUser" }
                  invitation: { $ref: "#/components/schemas/Invitation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /admin/users/{user}:
    parameters:
      - $ref: "#/components/parameters/UserUuid"
    patch:
      tags: [Admin]
      summary: Change or disable an account
      description: |
        `disabled: true` shuts the account without deleting anything: no
        sign-in, no API key, no OAuth token works for it until it is enabled
        again. Repeating the call changes nothing. The key's own account and
        the last active administrator cannot be disabled.
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 190 }
                email: { type: string, format: email, maxLength: 190 }
                password: { type: string, minLength: 12 }
                role: { type: string, enum: [admin, user] }
                disabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/ManagedUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /admin/users/{user}/folders:
    parameters:
      - $ref: "#/components/parameters/UserUuid"
    put:
      tags: [Admin]
      summary: Set an account's folders
      description: Exactly these folders afterwards, whatever was shared before.
      operationId: adminSetUserFolders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folders]
              properties:
                folders:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/ManagedUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /admin/users/{user}/invitation:
    parameters:
      - $ref: "#/components/parameters/UserUuid"
    post:
      tags: [Admin]
      summary: Issue a new invitation link
      description: |
        Any earlier link stops working. For an account that already has a
        password the link works as a reset; the old password stays valid until
        the link is used.
      operationId: adminInviteUser
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
                  user: { $ref: "#/components/schemas/ManagedUser" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The account is disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/documents:
    get:
      tags: [Admin]
      summary: Find a document by its path
      description: |
        For a system that put the file into Nextcloud itself. `state` says
        whether it can be found yet. A document is the Nextcloud file, keyed
        by its file id: renamed or moved, into another watched folder as well,
        it keeps uuid, link and tags once the new place has been crawled.
      operationId: adminFindDocument
      parameters:
        - name: folder
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: path
          in: query
          required: true
          description: Relative to the folder.
          schema: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/AdminDocument" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminKeyRequired"
        "404":
          description: Not known under this path, or not crawled yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal API key, `nxs_` followed by 40 characters.

  parameters:
    UserUuid:
      name: user
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentUuid:
      name: document
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: No key, an unknown one, or one that has expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The folder is not granted to the key's owner.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminKeyRequired:
      description: The key lacks the admin flag, or its owner is no longer an administrator.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown — or none of the caller's business.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: |
        Something in the request does not hold. An unknown tag, or one the
        caller may not assign, fails the whole call — nothing is dropped quietly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    DocumentTags:
      description: The document's tags as the caller sees them.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/DocumentTag" }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    User:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        two_factor_enabled: { type: boolean }

    TagWritable:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        slug:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Optional on create, ignored on update. Derived from the name if absent.
        color:
          type: string
          default: neutral
          enum: [neutral, primary, secondary, success, info, warning, error]
        description: { type: [string, "null"], maxLength: 500 }
        assign_policy:
          type: string
          default: everyone
          description: Global instance tags only.
          enum: [everyone, admin]
        position:
          type: integer
          minimum: 0
          maximum: 9999
          description: Order in the filter panel, lower first.
        enabled:
          type: boolean
          description: A tag switched off leaves the filter; its assignments stay.
        auto_rule:
          type: [string, "null"]
          description: Requires scope `global`.
          enum: [new_document, null]
        auto_duration_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 525600
          description: How long an automatic assignment lasts. Null means forever.

    Tag:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name:
          type: [string, "null"]
          description: Null on system tags — the interface translates those from the slug.
        color: { type: string }
        description: { type: [string, "null"] }
        scope:
          type: string
          enum: [global, personal]
          description: |
            `global`: an assignment is visible to everyone with access to the
            document. `personal`: only to whoever made it.
        assign_policy: { type: string, enum: [everyone, admin] }
        is_system:
          type: boolean
          description: Comes with the installation. Not deletable.
        is_private:
          type: boolean
          description: Created by the caller for themselves.
        enabled: { type: boolean }
        position: { type: integer }
        auto_rule: { type: [string, "null"] }
        auto_duration_minutes: { type: [integer, "null"] }

    TagBrief:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string }
        name: { type: [string, "null"] }
        color: { type: string }
        scope: { type: string, enum: [global, personal] }
        is_system: { type: boolean }

    DocumentTag:
      allOf:
        - $ref: "#/components/schemas/TagBrief"
        - type: object
          properties:
            source:
              type: string
              enum: [manual, auto]
            expires_at:
              type: [string, "null"]
              format: date-time
              description: Set only where the automation put the tag.

    TagKeyList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 50
          description: Slugs or uuids. An empty array is allowed and means "none".
          items: { type: string, maxLength: 64 }

    SearchHit:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        path: { type: string }
        directory: { type: string }
        extension: { type: string }
        mime_type: { type: [string, "null"] }
        size: { type: integer }
        size_bucket: { type: string }
        modified_at: { type: [integer, "null"], description: Unix timestamp. }
        year: { type: [integer, "null"] }
        author: { type: [string, "null"] }
        title: { type: [string, "null"] }
        page_count: { type: [integer, "null"] }
        instance_name: { type: string }
        folder_label: { type: string }
        folder_id: { type: integer }
        ocr_used: { type: boolean }
        has_preview: { type: boolean }
        highlighted_name: { type: string }
        snippet:
          type: [string, "null"]
          description: |
            Escaped text with `<mark>` around the matches. The full text never
            leaves the server.
        tags:
          type: array
          description: Global assignments plus the caller's own.
          items: { $ref: "#/components/schemas/TagBrief" }

    Facet:
      type: object
      properties:
        name:
          type: string
          description: |
            `tags` and `my_tags` carry tags; the rest are derived from the file.
        values:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                description: On tag facets, the tag's uuid — feed it back into `filters`.
              count: { type: integer }
              slug: { type: string, description: Tag facets only. }
              label: { type: [string, "null"], description: Tag facets only. }
              color: { type: string, description: Tag facets only. }
              is_system: { type: boolean, description: Tag facets only. }

    SearchResult:
      type: object
      properties:
        hits:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        total_pages: { type: integer }
        facets:
          type: array
          items: { $ref: "#/components/schemas/Facet" }
        took_ms: { type: [integer, "null"] }

    DocumentDetail:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        path: { type: string }
        directory: { type: string }
        extension: { type: [string, "null"] }
        mime_type: { type: [string, "null"] }
        size: { type: integer }
        modified_at: { type: [string, "null"], format: date-time }
        indexed_at: { type: [string, "null"], format: date-time }
        page_count: { type: [integer, "null"] }
        ocr_used: { type: boolean }
        metadata: { type: [object, "null"], additionalProperties: true }
        has_preview: { type: boolean }
        tags:
          type: array
          items: { $ref: "#/components/schemas/DocumentTag" }
        instance:
          type: object
          properties:
            name: { type: string }
            uuid: { type: string, format: uuid }
        folder:
          type: object
          properties:
            label: { type: string }
            uuid: { type: string, format: uuid }
        nextcloud_url:
          type: string
          description: Deep link into Nextcloud, for whoever has an account there.

    Instance:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        base_url: { type: string, format: uri }
        username: { type: string }
        verify_tls: { type: boolean }
        enabled: { type: boolean }
        health_state: { type: [string, "null"] }
        health_message: { type: [string, "null"] }
        health_checked_at: { type: [string, "null"], format: date-time }
        image_url: { type: [string, "null"] }
        folders_count: { type: integer }
        documents_count: { type: integer }

    Folder:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        label: { type: string }
        remote_path: { type: string }
        enabled: { type: boolean }
        interval_minutes: { type: integer }
        exclude_patterns:
          type: array
          items: { type: string }
        last_crawled_at: { type: [string, "null"], format: date-time }
        image_url: { type: [string, "null"] }
        documents_count: { type: integer }
        instance:
          type: object
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }

    ManagedUser:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, user] }
        is_admin: { type: boolean }
        disabled: { type: boolean }
        disabled_at: { type: [string, "null"], format: date-time }
        has_password: { type: boolean }
        invitation_pending: { type: boolean }
        invitation_expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
        folders:
          type: array
          items:
            type: object
            properties:
              uuid: { type: string, format: uuid }
              label: { type: string }

    Invitation:
      type: object
      description: Shown once. Only its hash is stored.
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    AdminDocument:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        path: { type: string, description: Relative to the folder. }
        remote_path: { type: string }
        state: { type: string, enum: [pending, indexed, failed, skipped] }
        failure_reason: { type: [string, "null"] }
        size: { type: integer }
        modified_at: { type: [string, "null"], format: date-time }
        indexed_at: { type: [string, "null"], format: date-time }
        folder:
          type: object
          properties:
            uuid: { type: string, format: uuid }
            label: { type: string }
        url:
          type: string
          format: uri
          description: The document page in the interface. Needs a sign-in and a share of the folder.
